<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .card {
        width: 430px;
        background: #111827;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        color: white;
    }

    h2 {
        text-align: center;
        color: #38bdf8;
    }

    .info {
        text-align: center;
        font-size: 13px;
        color: #aaa;
        margin-bottom: 20px;
    }

    .progress {
        height: 6px;
        background: #1f2937;
        border-radius: 10px;
        margin-bottom: 20px;
        overflow: hidden;
    }

    .progress-bar {
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #a855f7);
    }

    .input-group {
        margin-bottom: 15px;
    }

    label {
        font-size: 13px;
        color: #ccc;
    }

    .input-box {
        display: flex;
        align-items: center;
        background: #020617;
        border: 1px solid #374151;
        border-radius: 10px;
        padding: 8px;
        margin-top: 5px;
    }

    .input-box span {
        margin-right: 8px;
    }

    input, select, textarea {
        border: none;
        background: transparent;
        color: white;
        outline: none;
        width: 100%;
    }

    .input-box:focus-within {
        border-color: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    /* CUSTOM BUTTON OPTIONS */
    .option-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
    }

    .option-group input {
        display: none;
    }

    .option-group label {
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid #444;
        cursor: pointer;
        font-size: 13px;
        transition: 0.3s;
    }

    .option-group input:checked + label {
        background: linear-gradient(90deg, #38bdf8, #a855f7);
        color: white;
        border: none;
        box-shadow: 0 0 10px #38bdf8;
    }

    .section-title {
        margin-top: 10px;
        font-size: 14px;
        color: #60a5fa;
    }

    /* BUTTONS */
    .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    button {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    .primary {
        background: linear-gradient(90deg, #38bdf8, #a855f7);
        color: white;
    }

    .primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(168,85,247,0.5);
    }

    .secondary {
        background: transparent;
        border: 1px solid #555;
        color: #ccc;
    }

    .secondary:hover {
        border-color: #38bdf8;
        color: #38bdf8;
    }

</style>
</head>

<body>

<div class="card">
    <h2>Student Registration</h2>
    <div class="info">Prakarsh Shende | Roll No: 21</div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <form>

        <div class="row">
            <div class="input-group">
                <label>First Name</label>
                <div class="input-box">
                    <span>👤</span>
                    <input type="text" required>
                </div>
            </div>

            <div class="input-group">
                <label>Last Name</label>
                <div class="input-box">
                    <span>👤</span>
                    <input type="text" required>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>Email</label>
            <div class="input-box">
                <span>📧</span>
                <input type="email" required>
            </div>
        </div>

        <div class="input-group">
            <label>Phone</label>
            <div class="input-box">
                <span>📱</span>
                <input type="tel" required>
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-box">
                <span>🔒</span>
                <input type="password" required>
            </div>
        </div>

        <div class="input-group">
            <label>Date of Birth</label>
            <div class="input-box">
                <input type="date" required>
            </div>
        </div>

        <div class="section-title">Gender</div>
        <div class="option-group">
            <input type="radio" id="m" name="gender"><label for="m">Male</label>
            <input type="radio" id="f" name="gender"><label for="f">Female</label>
            <input type="radio" id="o" name="gender"><label for="o">Other</label>
        </div>

        <div class="input-group">
            <label>Course</label>
            <div class="input-box">
                <select required>
                    <option value="">Select</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>B.Sc</option>
                    <option>M.Tech</option>
                </select>
            </div>
        </div>

        <div class="section-title">Skills</div>
        <div class="option-group">
            <input type="checkbox" id="java"><label for="java">Java</label>
            <input type="checkbox" id="py"><label for="py">Python</label>
            <input type="checkbox" id="web"><label for="web">Web Dev</label>
            <input type="checkbox" id="ai"><label for="ai">AI/ML</label>
        </div>

        <div class="input-group">
            <label>Address</label>
            <div class="input-box">
                <textarea rows="2"></textarea>
            </div>
        </div>

        <div class="btn-group">
            <button type="reset" class="secondary">Reset</button>
            <button type="submit" class="primary">Register</button>
        </div>

    </form>
</div>

</body>
</html>
